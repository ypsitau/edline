[workspace]
resolver = "2"
members = [
    "edline",
    "apps/host",
]

[workspace.dependencies]
edline = { path = "edline" }
embedded-io-async = { version = "0.7.0" }
heapless = { version = "0.9.3" }
static_cell = { version = "2.1.1" }
serkey = { version = "0.1.4" }
unicode-width = { version = "0.2.3", features = ["no_std"] }
