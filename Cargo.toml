[workspace]
resolver = "2"
members = [
    "edline",
    "apps/host-console",
    "apps/host-graphics",
    "apps/host-round-buffer",
]
default-members = ["apps/host-console"]

[workspace.dependencies]
edline = { path = "edline" }
embedded-io-async = { version = "0.7.0" }
heapless = { version = "0.9.3" }
static_cell = { version = "2.1.1" }
serkey = { version = "0.1.4" }
unicode-width = { version = "0.2.3", features = ["no_std"] }

embedded-graphics = { version = "0.8.2" }
embedded-hal-async = { version = "1.0.0" }
