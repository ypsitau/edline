[package]
name = "main"
version = "0.1.0"
edition = "2024"

[dependencies]
edline = { workspace = true }
serkey = { version = "0.1.1" }

crossterm = { version = "0.29.0" }
heapless = { version = "0.9.3" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt"] }
embedded-io = { version = "0.7.1" }
embedded-io-async = { version = "0.7.0" }
embedded-io-adapters = { version = "0.7.0", features = ["tokio-1"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
