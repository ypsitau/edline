[package]
name = "edline"
version = "0.0.2"
edition = "2024"
authors = ["Yutaka Saito <ypsitau@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "A line editor for embedded systems"
repository = "https://github.com/ypsitau/edline"
readme = { workspace = true }

[dependencies]
embedded-io-async = { workspace = true }
heapless = { workspace = true }
static_cell = { workspace = true }
serkey = { workspace = true }
unicode-width = { workspace = true }

[features]
default = []
