[package]
name = "host-graphics"
version = "0.1.0"
edition = "2024"

[dependencies]
eg-seven-segment = { version = "0.2.0" }
embedded-graphics = { version = "0.8.2" }
embedded-graphics-framebuf = { version = "0.5.0" }
embedded-hal = { version = "1.0.0" }
embedded-hal-async = { version = "1.0.0" }
embedded-text = { version = "0.7.3" }
heapless = { version = "0.9.3" }
indoc = { version = "2.0.7" }
micromath = { version = "2.1.0" }
mplusfonts = { version = "0.3.4" }
time = { version = "0.3.55", default-features = false } # no_std
tinybmp = { version = "0.7.0" }
tinytga = { version = "0.5.0" }
u8g2-fonts = { version = "0.8.0" }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
embedded-graphics-simulator = { version = "0.8.0" }
chrono = { version = "0.4" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time"] }
