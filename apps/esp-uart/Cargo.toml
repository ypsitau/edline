[package]
edition = "2024"
name = "esp-uart"
version = "0.1.0"
license = "MIT or Apache-2.0"
rust-version = "1.88"

[workspace]
# An empty workspace section means that this package is independent of the parent workspace.

[build-dependencies]
regex = { version = "1.11.0" }

[dependencies]
critical-section = { version = "1.2.0" }
fixed = { version = "1.29.0" }
heapless = { version = "0.9.3" }
panic-halt = { version = "1.0.0" }
rand_core = { version = "0.10.1" }
static_cell = { version = "2.1.1" }

embassy-embedded-hal = { version = "0.6.0" }
embassy-executor = { version = "0.10.0" }
embassy-futures = { version = "0.1.2" }
embassy-sync = { version = "0.8" }
embassy-time = { version = "0.5.0" }

embedded-hal-1 = { version = "1.0.0", package = "embedded-hal" }
embedded-hal-async = { version = "1.0.0" }
embedded-io-async = { version = "0.7.0" }

esp-alloc = { version = "0.10.0", features = ["esp32"] }
esp-backtrace = { version = "0.19.0", features = ["panic-handler", "println", "esp32"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32"] }
esp-hal = { version = "~1.1.0", features = ["log-04", "unstable", "esp32"] }
esp-println = { version = "0.17.0", features = ["log-04", "esp32"] }
esp-rtos = { version = "0.3.0", features = ["embassy", "log-04", "esp32"] }

edline = { path = "../../edline" }
serkey = { version = "0.1.4" }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
